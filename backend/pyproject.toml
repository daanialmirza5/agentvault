[project]
name = "agentvault-backend"
version = "0.1.0"
description = "AgentVault API: tool permissions, approvals, audit, replay and safety evaluations for AI agents."
requires-python = ">=3.12"
license = "MIT"

[tool.pytest.ini_options]
testpaths = ["app/tests"]
addopts = "-q --strict-markers"
markers = [
    "e2e: full API workflow tests (still in-process, no network)",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
    "S101",   # assert is fine in tests
    "S311",   # `random` is used deliberately for seeded, deterministic mock tools
    "RUF012", # mutable class defaults are SQLAlchemy/Pydantic idioms
    "B008",   # FastAPI Depends() in defaults
]

[tool.ruff.lint.per-file-ignores]
"app/tests/*" = ["S", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/", "app/tests/"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["jsonschema.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["app"]
omit = ["app/tests/*"]
