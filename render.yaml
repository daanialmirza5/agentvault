# Render Blueprint (https://render.com/docs/blueprint-spec): a public sandbox demo of AgentVault.
# One free web service runs the API and serves the web UI. Free instances sleep after ~15 idle
# minutes and have an ephemeral filesystem, so the SQLite database resets on every restart and is
# re-seeded with the built-in tools, policies and scenarios.
#
# AGENTVAULT_DEMO_MODE opens the API without a token. It is only allowed without an API token and
# without an LLM endpoint: agents are scripted and every tool runs against the mock sandbox.
# For a private deployment, remove DEMO_MODE and set AGENTVAULT_API_TOKEN instead.
services:
  - type: web
    name: agentvault
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/v1/ready
    envVars:
      - key: AGENTVAULT_ENVIRONMENT
        value: production
      - key: AGENTVAULT_DEMO_MODE
        value: "true"
      - key: AGENTVAULT_DATABASE_URL
        value: sqlite:////tmp/agentvault.db
      - key: AGENTVAULT_OPERATOR_NAME
        value: demo-visitor
      - key: AGENTVAULT_RETENTION_DAYS
        value: "1"
